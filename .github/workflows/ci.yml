name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the token this workflow runs with. Nothing below writes to
# the repository: it installs, lints, tests and builds. Declaring the scope here
# means a step added later has to ask for more on purpose, instead of inheriting
# whatever the repository default happens to be, which matters most on a public
# repository where pull requests arrive from forks.
permissions:
  contents: read

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # pnpm, at the version pinned in package.json's packageManager field:
      # the lockfile is pnpm's, and `npm ci` needs a package-lock.json this
      # repository does not have.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma 8: emit the contract artefacts from prisma/contract.prisma (also
      # done by postinstall) and fail if the committed ones are stale, then
      # check the migration graph's integrity. Both are offline.
      - name: Emit Prisma contract
        run: |
          pnpm exec prisma contract emit
          git diff --exit-code -- src/generated/prisma8/ || (echo "src/generated/prisma8 is stale: run pnpm db:emit and commit" && exit 1)

      - name: Check migration graph
        run: pnpm exec prisma migration check

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unit tests on the pure logic in src/lib. They need no database and no
      # secrets, so they run before the build and fail fast.
      - name: Test
        run: pnpm test

      # `next build` type-checks and compiles. The env values below are
      # build-time placeholders, not real secrets: the build constructs clients
      # (Prisma adapter, Auth.js) at module load but never connects to a DB or
      # authenticates, so any well-formed value works here.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Security net for the release cadence: dependency updates wait for the
      # next release, so a serious advisory has to announce itself instead of
      # waiting to be noticed.
      #
      # Scoped to production dependencies, at `high`. Two deliberate choices.
      #
      # `--omit=dev` because those are the packages that end up in the product
      # you ship to your own users. Dev tooling advisories are often blocked
      # upstream by a peer range nobody controls, so gating on them means a red
      # build you cannot fix, and an alarm that is always on is an alarm nobody
      # reads.
      #
      # `high` and not `critical` because in this ecosystem critical is rare, and
      # a threshold that never fires is not a safety net. This step sat at
      # `critical` while the high advisories inside Next.js's own tree (postcss,
      # sharp) had no fix short of downgrading Next. Next 16.3.0 shipped that
      # fix, so the reason is gone.
      #
      # It runs last on purpose. A new advisory is not a defect of the code in
      # this commit, so it must never hide the result of lint, test and build.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  migrations:
    name: Migrations apply and match the contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M1: every migration applies on an empty database, in one transaction.
      - run: pnpm exec prisma db migrate --db "$DATABASE_URL"
      # M2: the result is exactly the contract, nothing more (strict).
      - run: pnpm exec prisma db verify --strict --db "$DATABASE_URL"
      # The seeds run on the migrated schema.
      - run: pnpm db:seed

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lessgap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/lessgap_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
