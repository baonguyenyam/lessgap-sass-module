services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lessgap_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lessgap_test"]
      interval: 5s
      timeout: 5s
      retries: 10
